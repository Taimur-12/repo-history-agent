- id: messagegraph-status
  q: "i'm upgrading an old project that uses MessageGraph and i read somewhere it was removed. can i still use it, and what should i use instead?"
  expect_tools_called: [search, "get_pr:5843"]
  expect_cites: [5843, 4875]
  also_acceptable: [5101, 4873, 5251, 5252, 1330]
  must_mention: ["StateGraph", "deprecated"]
