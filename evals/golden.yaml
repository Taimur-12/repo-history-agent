- id: checkpoint-serialization-history
  q: "i opened my postgres checkpoint tables and the blobs aren't readable json anymore. how has langgraph's checkpoint serialization format changed over time, and what does it use now by default?"
  expect_tools_called: [search, "get_pr:1716"]
  expect_cites: [1716]
  also_acceptable: [317, 3953, 3852, 5057, 6269, 7517, 7582, 1185, 1311]
  must_mention: ["msgpack"]
  should_not:
    - "\\b(default|now|currently|today)\\b\\W+(\\w+\\W+){0,4}?(uses?|is|stores?)\\W+(\\w+\\W+){0,1}?(pickle|json)\\b(?!\\W+(\\w+\\W+){0,3}?(fallback|only|opt))"
    - "\\b(are|is|gets?|got)\\s+(now\\s+|always\\s+)?encrypted\\s+by\\s+default"
    - "\\bencryption\\s+is\\s+(now\\s+)?(on|enabled|applied|used)\\s+by\\s+default"
    - "\\bpickle\\b(?:[^.\\n]|\\.(?=\\d)){0,30}\\b(is|as) (the )?default\\b"

