- id: recursion-limit-default
  q: "my graph used to stop with a recursion limit error after 25 steps but now long runs just keep going. did the default recursion limit change? what is it now and why?"
  expect_tools_called: [search, "get_pr:6676", "get_pr:7355"]
  expect_cites: [6676, 7355]
  also_acceptable: []
  must_mention: ["10007"]
  should_not:
    - "(recursion[_ ]limit|default)\\W+(is|remains)\\W+(still\\W+)?25\\b"
    - "(default|limit)(?:[^.\\n]|\\.(?=\\d)){0,40}?(\\bto|=|→|\\bis|\\bwas|\\bat)\\s+1,?000\\b(?!\\d)(?!(?:[^.\\n]|\\.(?=\\d))*\\b(but|however|although|though|whereas|while|contradict\\w*|disagree\\w*|actually|in fact)\\b)"

- id: langgraph-2-release-date
  q: "when is langgraph 2.0 coming out? i want to know how long i have before the deprecated stuff gets removed"
  expect_tools_called: [search]
  expect_cites: []
  also_acceptable: [5843, 5243, 4973]
  must_match_any:
    - "no (official |announced |public |confirmed )?(release )?date"
    - "(not|n't) (been )?(announced|scheduled|published|stated|mentioned|given)"
    - "(couldn't|could not|can't|cannot|didn't|did not) find"
    - "no (information|record|mention|announcement|timeline)"
  should_not:
    - "langgraph 2\\.0(\\.0)? (was|has been|is) (released|out|available)"
    - "\\b(release[sd]?|ship(s|ped)?|launch(es|ed)?|coming out|come out|arrive[sd]?)\\b[^.]{0,40}\\b(Q[1-4]\\s*20\\d\\d|(early|mid|late)[- ]20\\d\\d|(january|february|march|april|may|june|july|august|september|october|november|december)\\s+20\\d\\d)"

- id: tool-rerun-after-error
  q: "my tool calls a payment API. the call timed out and the graph raised an error. when i invoke it again with the same thread_id to resume, it runs the tool again and the customer gets charged twice. is this a known bug, and has it been fixed in langgraph?"
  expect_tools_called: [search]
  expect_cites: [9185]
  also_acceptable: [9240, 9239, 8039, 8463, 8464, 8465, 9232, 9265, 3126]
  must_mention: ["idempoten"]
  must_match_any:
    - "by design"
    - "(expected|intended|documented) behaviou?r"
    - "how resume works"
    - "not (a bug|considered a bug|something .{0,20}fix)"
    - "(has not|hasn't|was not|wasn't|never) been (fixed|changed|resolved)"
    - "(no|not) (a )?fix\\b"
    - "not[_ ]planned"
    - "won'?t (be )?(fixed|changed)"
    - "(still|currently) (re-?runs?|re-?executes?|runs? (it|the tool) again)"
  should_not:
    - "\\b(this|it|the (issue|bug|problem|double[- ]charge|re-?run))\\W+(has been|was|is( now)?|got)\\W+(fixed|resolved|solved)"
    - "\\bupgrad\\w+\\b(?:[^.\\n]|\\.(?=\\d)){0,40}\\b(fix|fixes|fixed|resolve[sd]?|solve[sd]?|prevent\\w*)\\b"
    - "(#?9232|#?9265|#?846[345])\\W+(\\w+\\W+){0,4}(fix(es|ed)?|resolv\\w+|solv\\w+|prevent\\w*)\\W+(\\w+\\W+){0,3}(this|your|the (double|duplicate|re-?run|issue|bug))"
    - "(fixed|resolved) (in|by) (#?9232|#?9265|#?846[345]|v?1\\.2\\.1[3-9])"

